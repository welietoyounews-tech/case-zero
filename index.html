e-columns:1fr}.source-grid{grid-template-columns:1fr 1fr}.hypotheses{grid-template-columns:1fr}.linker{grid-template-columns:1fr}.linker label select,.linker label input{margin-bottom:8px}.page-heading{display:block}.page-heading .stamp{margin:0 0 20px}.modal{padding:23px}.spoken{font-size:20px}.portrait{width:95px;min-width:95px}.submission{flex-wrap:wrap}.desk-scene{padding:25px 15px 25px 75px;border-width:6px}.lamp{width:65px;left:0}.base{width:50px}.paper-stack{grid-template-columns:1fr 1fr;gap:12px}.paper{padding:13px 10px}.paper strong{font-size:17px}.register article{flex-direction:column;gap:7px}.register .lab-result{grid-template-columns:1fr}.calendar-grid{grid-template-columns:repeat(5,1fr)}.ending h1{font-size:36px}}@media(max-width:450px){main{padding:24px 15px}.source-grid{grid-template-columns:1fr}.clock{order:2}.ap{order:3}.queues{order:4}.top>button{order:5}.brand{width:100%}.brand small{display:inline;margin-left:15px}.paper strong{font-size:15px}.paper small{font-size:7px}.dialogue-head{gap:15px}.dialogue-head .portrait{width:85px;min-width:85px}.modal{padding:20px 15px}.scrim{padding:10px}.document-body{font-size:19px}.responses .response{font-size:15px}.form-sheet{padding:20px}.person-card{padding:18px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{.top,aside,button,.scrim{display:none}.body-shell{display:block}main{padding:0}.form-sheet{break-inside:avoid}body{background:white}}

const CASE={id:'oyster-bay-30',days:30,ap:3,sampleDelay:1,labDelay:2,cooldown:3,culprit:'p4'};
const documents                 =[
{id:'d1',title:'Notice of illness',heading:'PRIVATE CORRESPONDENCE · OYSTER BAY',body:'Sir, six persons in the summer household have been attended for typhoid fever. The household numbers eleven. We require an inquiry into the origin of this illness. You are retained for thirty days. The property cannot remain under a cloud indefinitely. — G. Thompson',clue:'Six illnesses in one household of eleven. Your contract ends after Day 30.'},
{id:'d2',title:'Physician’s memorandum',heading:'MEDICAL ATTENDANCE · SEPTEMBER 1906',body:'The illnesses developed over several days. Prolonged fever and abdominal complaints were observed. Both members of the family and domestic staff were affected. A person’s employment or social station cannot by itself explain the distribution. — Attending physician',clue:'The cases cross household roles; shared provisions merit inquiry.'},
{id:'d3',title:'Onset ledger',heading:'ABSTRACT OF ATTENDANCE',body:'First illness reported: 27 August. Last illness reported: 3 September. No satisfactory explanation has yet been established. Later patients cannot be assumed to have contracted infection from the first simply because they fell ill later.',clue:'A short onset cluster can follow a shared exposure. Onset order is not a transmission chain.'},
{id:'d4',title:'Occupancy register',heading:'THOMPSON PROPERTY · SUMMER LET',body:'Tenant: C. H. Warren and family. Total household including staff: eleven. Meals and water are supplied from the house. The gardener takes provisions on the property. The physician attends but does not reside here.',clue:'The physician is not a resident. Family, servants and gardener have overlapping exposures.'},
{id:'d5',title:'Water description',heading:'PROPERTY SERVICES · WATER',body:'Water is drawn and stored for household use. Drinking vessels, the kitchen tap and the storage cistern offer separate points of inquiry. A satisfactory observation today does not establish the condition of the supply in August.',clue:'Present water samples may not represent conditions during the outbreak.'},
{id:'d6',title:'Drainage memorandum',heading:'SANITARY INSPECTION · COPY',body:'No continuing drainage defect sufficient to explain the household fever has been established. The cesspool and soil about its boundary warrant comparison with the water supply. The presence of filth alone does not demonstrate a path into drinking water.',clue:'Contamination at a waste site does not prove contamination of a consumed supply.'},
{id:'d7',title:'Kitchen inventory',heading:'STORES AND SERVICE',body:'Milk, cream, fruit, flour and bread are recorded among provisions. Hot meals and cold dishes are prepared. Fruit may be cut and added after heating. There is no preserved portion of the meals served before the illnesses.',clue:'Food handled without further heating offers a possible route; old meals cannot now be cultured.'},
{id:'d8',title:'Staff register',heading:'DOMESTIC APPOINTMENTS',body:'The caretaker, gardener and household maid are longstanding employees. A new cook entered service on 4 August. Food is handled by more than one person between delivery and service. Earlier references may be obtained by inquiry, rather than accepted as guarantees of health.',clue:'A staff change precedes illness. Compare dates and previous workplaces before attributing cause.'},
{id:'d9',title:'Provision invoices',heading:'MILK AND GENERAL PROVISIONS',body:'Milk is delivered to this house and to other customers. Fruit and bread arrive through separate merchants. The invoices record delivery, not consumption. Shellfish was purchased weeks before the outbreak; the precise interval should be confirmed with a witness.',clue:'A supplier hypothesis should be checked against other customers and exposure timing.'},
{id:'d10',title:'Patient statements',heading:'RECOLLECTIONS · NOT SWORN TESTIMONY',body:'The patients report no recent journey away from Oyster Bay. One servant recalls having helped with meals while another was indisposed. A family member insists the water must be at fault. Recollections of particular meals disagree. Further interviews are necessary.',clue:'Local exposure is plausible. Patient and employer theories remain testimony, not proof.'}
];
const people         =[
{id:'p1',name:'Arthur Bell',alias:'A. Bell',role:'Caretaker',place:'Property office',portrait:0,opening:'I keep the property in order. I will discuss the pipes, but I will not accept blame just because something happened here.',reply:'Then we can compare what was inspected with what people actually used.',topic:'Show me how the water reaches the house.',statement:'The kitchen, cistern and drinking vessels belong to one supply. I have not found a route from the waste ground into it. The inspection was made after the illnesses.',clue:'Shared water system; no demonstrated route from waste to consumption.',proof:'d6',proofLine:'Your inspection records no continuing defect. What could it have missed?',history:'Bell worked at this property for eight seasons. No previous outbreak cluster was identified in the reconstructed employer inquiries. A drainage repair last spring concerns a different line.',historyLink:false},
{id:'p2',name:'Ellen Price',alias:'E. Price',role:'Household maid',place:'Servants’ hall',portrait:1,opening:'I was ill myself. If you intend to say I brought the fever, let me hear what you have found first.',reply:'I can tell you what I remember, though not every plate that went to the table.',topic:'What did the family and staff eat in common?',statement:'I carried dishes from the kitchen. There was fruit folded into a cold dessert. I also helped prepare food. I became ill after several others had already been exposed; being a patient is not the same as starting the outbreak.',clue:'Cold food handling is a lead. A positive specimen from a recovering patient would not establish the original source.',proof:'d3',proofLine:'The onset ledger does not establish who infected whom. Let us reconstruct the meals.',history:'Price has served the same family for four years. No comparable earlier household cluster was found. Her present typhoid illness follows the shared summer exposure; the record does not establish earlier carriage.',historyLink:false},
{id:'p3',name:'Samuel Reed',alias:'S. Reed',role:'Milk deliveryman',place:'Delivery yard',portrait:2,opening:'My round serves a dozen houses. An accusation could ruin it. Are you asking about a delivery or making a charge?',reply:'I will open the ledger if you distinguish a spoiled bottle from a cause of fever.',topic:'Were there illnesses among your other customers?',statement:'No similar cluster has been reported to me on this round. I cannot answer for every customer’s health. A bottle collected now is not the milk served in August.',clue:'No corroborating customer cluster in the reconstructed delivery inquiry; reporting is incomplete.',proof:'d9',proofLine:'These invoices show other customers. May we compare their reports?',history:'Reed changed dairies two years ago. One earlier customer had a brief stomach complaint, without a documented typhoid cluster. A change of employer alone supplies no causal link.',historyLink:false},
{id:'p4',name:'Mary Mallon',alias:'M. M.',role:'Cook',place:'Kitchen quarters',portrait:3,opening:'I have been well. I helped when others were sick. Explain what you need; do not come here calling me a danger.',reply:'You can ask about my work. I will not pretend to remember every dish or accept a charge without evidence.',topic:'Tell me about foods served without further heating.',statement:'I prepared hot meals and a cold fruit dessert. I have worked in several households and have cared for sick people. Feeling well is what makes your suspicion difficult for me to understand.',clue:'Food preparation and apparent health can coexist. Earlier employment is independently checkable.',proof:'d8',proofLine:'The register places your arrival before the illness. May I ask about earlier positions?',history:'1902 · Dark Harbor, Maine: an employer recalls typhoid in the household while Mallon was cooking there.\n1904 · Sands Point, New York: illness among domestic staff during her employment.\n1906 · Oyster Bay: appointment on 4 August precedes the present cluster.\nThese are separate households, not a single shared water supply. Employer reports are retrospective and contain gaps. The recurring employment link requires biological corroboration; it does not establish the exact dish.',historyLink:true},
{id:'p5',name:'Dr. Edwin Hale',alias:'E. Hale',role:'Attending physician',place:'Consulting rooms',portrait:4,opening:'My records concern patients. You may inspect the relevant entries, but speculation should not be confused with diagnosis.',reply:'A useful inquiry separates the illness from the question of its source.',topic:'Can a person who appears well still merit examination?',statement:'Appearance cannot settle bacteriology. Excreta may be examined; a blood reaction answers a different question. One negative specimen is a limited observation. The first patient is not automatically the source.',clue:'Repeated bacteriology can be needed. A Widal reaction does not establish current shedding.',proof:'d2',proofLine:'Your memorandum distinguishes the household cluster. Can you explain the limits of one examination?',history:'Hale attended these patients after their illnesses began. His earlier practice reveals no repeated connection with the households in this inquiry. The chronology weighs against him as the initiating source.',historyLink:false},
{id:'p6',name:'Thomas Ward',alias:'T. Ward',role:'Gardener',place:'Garden gate',portrait:5,opening:'People hear that I work near the drains and make up the rest. Ask where I ate, not only where I stood.',reply:'I took food from the house like the others. The fever did not respect the garden gate.',topic:'When was shellfish last eaten, and where did you take meals?',statement:'The shellfish meal was about six weeks before the fever. I ate food prepared in the house and drank its water. Waste ground is dirty, but that does not tell you how illness reached the table.',clue:'Shellfish timing is a weak fit for a shared August exposure. Shared household provision connects the gardener.',proof:'d9',proofLine:'The invoices leave the shellfish date uncertain. Help me place it against the first illness.',history:'Ward has worked locally for many years. No repeated pattern across different outbreak households was found. His own illness belongs to the present household cluster.',historyLink:false},
{id:'p7',name:'George Thompson',alias:'G. Thompson',role:'Property owner',place:'Property office',portrait:6,opening:'I hired you to settle the matter, not to place my name in a newspaper. What is your next reasonable inquiry?',reply:'You may inspect records, provided that conclusions follow evidence.',topic:'What changed before the outbreak?',statement:'The cook changed in August, but supplies and temporary visitors also changed. I want the house cleared; you should keep that interest in mind when judging my account.',clue:'Owner testimony has a financial interest. Staff timing is a lead requiring corroboration.',proof:'d4',proofLine:'The occupancy register suggests shared meals. May I verify the staff changes?',history:'Property and business records show no pattern of food preparation across affected households. Thompson’s financial incentive may bias testimony; it does not prove biological transmission.',historyLink:false},
{id:'p8',name:'Agnes Cole',alias:'A. Cole',role:'Provision merchant',place:'Market',portrait:7,opening:'We sell to many kitchens. Tell me which consignment you mean before you suggest my goods are responsible.',reply:'I can distinguish today’s stock from a delivery made weeks ago.',topic:'Can you trace the fruit and flour deliveries?',statement:'Other customers received goods from the same merchants. I know of no comparable fever cluster. Fresh stock remains available to examine; the August fruit and prepared dishes are gone.',clue:'Current food samples are not retained outbreak meals. A distribution pattern can test the supplier explanation.',proof:'d7',proofLine:'The kitchen list includes fruit and flour. Can we trace their distribution?',history:'Cole operates a fixed market stall. Records connect the business to many healthy households as well as this one; no repeated person-linked outbreak pattern was found.',historyLink:false}
];
const sources               =[
...([['e1','Dining-room drinking water','water','House'],['e2','Kitchen tap water','water','Kitchen'],['e3','Stored cistern water','water','Grounds'],['e4','Well water','water','Grounds'],['e5','Garden pump water','water','Garden'],['e6','Delivery milk','milk','Yard'],['e7','Kitchen milk jug','milk','Kitchen'],['e8','Current cream stock','milk','Kitchen'],['e9','Current fruit lot','food','Market'],['e10','Current flour lot','food','Kitchen'],['e11','Freshly prepared pudding','food','Kitchen'],['e12','Current bread loaf','food','Kitchen'],['e13','Cesspool liquid','sewage','Grounds'],['e14','Drain outflow','sewage','Grounds'],['e15','Soil beside the privy','soil','Grounds'],['e16','Soil beside the cistern','soil','Grounds'],['e17','Household waste liquid','sewage','Yard'],['e18','Delivery vessel rinse water','water','Yard']]                                         ).map(([id,label,kind,place])=>({id,label,kind,place})),
...people.flatMap(p=>(['stool','urine','blood']                  ).map(kind=>({id:`${p.id}-${kind}`,label:`${p.role} · ${kind==='blood'?'blood serum':kind+' specimen'}`,kind,place:p.place,person:p.id})))
];
const methods                                                              ={
 environment:{name:'Environmental bacteriological examination',kinds:['water','milk','food','soil','sewage'],note:'Culture-based inquiry with period identification; later samples cannot recreate August conditions.'},
 culture:{name:'Culture with confirmatory identification',kinds:['stool','urine'],note:'Period bacteriology, including culture characteristics and identification. No molecular matching.'},
 microscopy:{name:'Microscopic examination',kinds:['water','milk','food','soil','sewage','stool','urine'],note:'Appearance alone cannot reliably establish typhoid identity.'},
 widal:{name:'Widal serum reaction',kinds:['blood'],note:'Agglutination response; not proof of present shedding. Historically available, diagnostically limited.'}
};
const routes={water:'Contaminated water alone',food:'Infection carried through handled food',contact:'Casual proximity without an ingestion route'};
const patterns={recurrence:'Recurring illness in separate workplaces with different supplies',onset:'The earliest patient must have caused every later case',appearance:'The person looks healthy, so cannot carry infection',single:'One appointment date establishes responsibility'};
const certainties={limited:'The evidence supports a source; the precise dish and intent remain unproved',dish:'The evidence proves the exact dessert was contaminated',intent:'The evidence proves deliberate infection'};

                                                                                      
function initial(introSkipUnlocked=false)      {return {version:2,introSkipUnlocked,begun:false,day:1,ap:3,stage:1,view:'Office',reviewed:[],success:[],cooldown:{},attitudes:{},samples:[],labs:[],histories:[],evidence:[],active:null,conversation:'',notebook:'',hypotheses:{water:'',food:'',human:''},connections:[],draft:{suspect:'',route:'',pattern:'',certainty:'',citations:[],reason:''},ended:null,log:[]};}
const person=(id       )=>people.find(p=>p.id===id);
const source=(id       )=>sources.find(s=>s.id===id);
function record(s      ,id       ,title       ,text       ,kind       ,pid        ){if(!s.evidence.some(e=>e.id===id))s.evidence.push({id,title,text,kind,...(pid?{person:pid}:{}),day:s.day});}
function log(s      ,text       ){s.log.unshift(`Day ${s.day} · ${text}`);}
function guard(s      ,cost=1,field=true)       {if(s.ended)return 'The investigation is closed.';if(s.active)return 'Finish or leave the current conversation first.';if(field&&s.stage!==2)return 'Review all ten introductory documents before fieldwork.';if(s.ap<cost)return 'Not enough actions remain today. End the day to continue.';return '';}
function readDocument(s      ,id       )       {const d=documents.find(d=>d.id===id);if(!d)return 'Unknown document.';if(s.reviewed.includes(id))return 'This document is already filed; rereading is free.';const error=guard(s,1,false);if(error)return error;const intro=documents.slice(0,3).find(d=>!s.reviewed.includes(d.id));if(intro&&intro.id!==id)return 'Read the opening correspondence in order, beginning with the notice of illness.';s.ap--;s.reviewed.push(id);record(s,id,d.title,d.body+'\n\nInvestigator’s note: '+d.clue,'Document');log(s,'Reviewed '+d.title);if(s.reviewed.length===documents.length){s.stage=2;return 'All introductory records reviewed. Field investigation is now available.';}return 'Document filed. One action spent.';}
function endDay(s      )       {if(s.ended)return 'The investigation is closed.';if(s.active)return 'Finish or leave the current conversation before ending the day.';if(s.day===CASE.days){s.ended={kind:'expired',reason:'The thirty-day contract has expired without a final accusation. No additional days are available.',checks:[]};log(s,'Contract expired.');return s.ended.reason;}s.day++;s.ap=CASE.ap;const arrivals         =[];for(const sample of s.samples)if(!sample.ready&&sample.due<=s.day){sample.ready=true;arrivals.push(source(sample.source) .label);log(s,'Specimen received: '+source(sample.source) .label);}for(const lab of s.labs)if(!lab.done&&lab.due<=s.day){const sample=s.samples.find(x=>x.id===lab.sample) ;const result=resolveLab(sample,lab.method);Object.assign(lab,{done:true,...result});record(s,lab.id,'Laboratory report · '+source(sample.source) .label,result.text,'Laboratory',source(sample.source) .person);log(s,'Laboratory report received: '+source(sample.source) .label);arrivals.push('laboratory report');}return `Day ${s.day}. Three actions available.${arrivals.length?' Received: '+arrivals.join('; ')+'.':''}`;}
function startInterview(s      ,id       )       {const error=guard(s);if(error)return error;const p=person(id);if(!p)return 'Unknown witness.';if((s.cooldown[id]||0)>s.day)return `This witness will speak again on Day ${s.cooldown[id]}.`;s.ap--;s.active={person:id,node:'opening'};s.conversation=p.opening;log(s,'Interview begun: '+p.role);return '';}
                                                                  
function choices(s      )         {if(!s.active)return [];const p=person(s.active.person) ;if(s.active.node==='opening')return [{id:'respect',text:'I understand your concern. Let us establish what you know before drawing conclusions.'},{id:'business',text:'I need an accurate account for the inquiry. Can we work through the records?'},{id:'proof',text:p.proofLine,disabled:!s.reviewed.includes(p.proof)},{id:'accuse',text:'Your reluctance makes you look responsible. You had better confess.'}];if(s.active.node==='questions')return [{id:'topic',text:p.topic},{id:'pattern',text:'I have checked your former workplaces. Help me interpret the pattern.',disabled:!s.histories.includes(p.id)},{id:'lab',text:'I have an examination result associated with you. Let us discuss what it can and cannot establish.',disabled:!completedLabs(s,p.id).length},{id:'demand',text:'Enough questions. Give me a specimen now, or I will call you guilty.'},{id:'leave',text:'I will return after checking the records independently.'}];return [{id:'agree',text:'May I seek your work references and arrange an examination? I will explain its limits and preserve your account.'},{id:'partial',text:'Thank you. I will leave the personal examination and references for another conversation.'},{id:'insult',text:'Your account is worthless. I will take what I want.'}];}
function reply(s      ,id       )       {if(s.ended||!s.active)return 'No active conversation.';const option=choices(s).find(c=>c.id===id);if(!option||option.disabled)return 'That response requires evidence you do not yet have.';const p=person(s.active.person) ;
if(['accuse','demand','insult'].includes(id)){s.cooldown[p.id]=s.day+CASE.cooldown;s.attitudes[p.id]='Refuses further discussion';s.conversation='“You have turned an inquiry into an accusation. Leave. I will not speak to you again for three days.”';s.active=null;log(s,p.role+' ended the interview; available Day '+s.cooldown[p.id]);return `Interview terminated. Available again at the start of Day ${s.cooldown[p.id]}. The action is spent.`;}
if(['leave','partial'].includes(id)){s.active=null;s.attitudes[p.id]='Reserved';s.conversation='“Very well. Return when you are ready to ask on that basis.”';log(s,'Partial interview: '+p.role);return 'Interview ended without agreement. No new personal sample or history access.';}
if(['respect','business','proof'].includes(id)){s.active.node='questions';s.conversation=(id==='respect'?p.reply:id==='business'?'“I will answer relevant questions, but I expect you to distinguish fact from suspicion.”':'“You have read the record. That is a reasonable place to begin.”');return '';}
if(['topic','pattern','lab'].includes(id)){s.active.node='agreement';s.conversation=id==='topic'?p.statement:id==='pattern'?'“Those reports were written by other people. Check the dates and the supplies independently; employment alone is not an explanation.”':'“An examination is evidence about a specimen. It does not say what I intended or establish every earlier event.”';record(s,`statement-${p.id}`,'Statement · '+p.role,p.statement+'\n\n'+p.clue,'Interview statement',p.id);if(id!=='topic')record(s,`followup-${p.id}-${id}`,'Follow-up · '+p.role,s.conversation,'Interview follow-up',p.id);return '';}
if(id==='agree'){if(!s.success.includes(p.id))s.success.push(p.id);s.attitudes[p.id]='Cooperating';record(s,`interview-${p.id}`,'Interview completed · '+p.role,'The witness has agreed to references and personal examination in this authored encounter. '+p.clue,'Completed interview',p.id);s.active=null;s.conversation='“On those terms, I will cooperate. You may inquire into my employment and arrange an examination.”';log(s,'Successful interview: '+p.role);return 'Interview successful. Personal specimens and employment inquiry unlocked.';}return '';}
function collectSample(s      ,id       )       {const error=guard(s);if(error)return error;const src=source(id);if(!src)return 'Unknown source.';if(s.samples.some(x=>x.source===id&&x.collected===s.day))return 'Already collected today. This source is available again tomorrow.';if(src.person&&!s.success.includes(src.person))return 'A successful interview is required before collecting a personal specimen.';s.ap--;s.samples.push({id:'sample-'+(s.samples.length+1),source:id,collected:s.day,due:s.day+CASE.sampleDelay,ready:false,submitted:false});log(s,'Collected '+src.label+'; arrives Day '+(s.day+1));return `Collection arranged. Specimen available at the start of Day ${s.day+1}.`;}
function requestLab(s      ,sampleId       ,method       )       {const error=guard(s);if(error)return error;const sample=s.samples.find(x=>x.id===sampleId);if(!sample||!sample.ready)return 'The specimen has not arrived.';if(sample.submitted)return 'This specimen has already been submitted. Collect another for another examination.';if(!methods[method]?.kinds.includes(source(sample.source) .kind))return 'That method is not appropriate for this specimen.';s.ap--;sample.submitted=true;s.labs.push({id:'lab-'+(s.labs.length+1),sample:sampleId,method,submitted:s.day,due:s.day+CASE.labDelay,done:false});log(s,'Submitted '+source(sample.source) .label+'; report Day '+(s.day+2));return `Analysis submitted. Report at the start of Day ${s.day+2}.${s.day+2>CASE.days?' This falls after your contract deadline.':''}`;}
function resolveLab(sample       ,method       )                              {const src=source(sample.source) ;
if(method==='microscopy')return {finding:'inconclusive',text:'Organisms or cellular material are visible. Morphology alone cannot identify typhoid bacilli or establish the source of this outbreak.'};
if(method==='widal')return {finding:'inconclusive',text:'The serum reaction is not decisive for present carriage. A reaction can reflect earlier infection; this examination does not demonstrate current shedding.'};
if(method==='culture'){
const positive=src.kind==='stool'&&((src.person===CASE.culprit&&sample.collected%3!==0)||(src.person==='p2'&&sample.collected<=18)||(src.person==='p6'&&sample.collected<=12));
return positive?{finding:'positive',text:'Typhoid bacilli recovered and identified by the simulated period examination. This supports shedding at collection, not the precise meal, source chronology or intent. Compare the employment and illness histories.'}:{finding:'negative',text:'No typhoid bacilli recovered from this specimen. Intermittent shedding and imperfect recovery mean one negative result does not exclude carriage. Compare history and consider a fresh specimen.'};}
if(['e7','e17'].includes(src.id))return {finding:'unusable',text:'Mixed growth and a compromised specimen prevent a useful typhoid determination. This is not a negative result and does not establish a source.'};
if(['soil','sewage'].includes(src.kind))return {finding:'inconclusive',text:'Heavy mixed bacterial growth is consistent with this waste-associated site. No specific link to the consumed water or food is established. Dirt is not a demonstrated transmission chain.'};
return {finding:'negative',text:'No typhoid bacilli recovered in the simulated environmental examination. The material was collected after the outbreak; it does not exclude transient contamination in August.'};}
function history(s      ,id       )       {const error=guard(s,3);if(error)return error;const p=person(id);if(!p)return 'Unknown person.';if(s.ap!==3)return 'Employment research must begin on an unused day with all three actions.';if(!s.success.includes(id))return 'Successfully interview this person before tracing employment.';if(s.histories.includes(id))return 'This employment history is already complete.';s.ap=0;s.histories.push(id);record(s,'history-'+id,'Employment history · '+p.role,p.history,'Employment history',id);log(s,'Entire day spent reconstructing '+p.role+' employment.');const next=endDay(s);return 'Employment report filed. '+next;}
function completedLabs(s      ,id       )      {return s.labs.filter(l=>l.done&&source(s.samples.find(x=>x.id===l.sample) .source)?.person===id);}
function eligibility(s      ,id       )                                                {return {interview:s.success.includes(id),history:s.histories.includes(id),lab:completedLabs(s,id).length>0};}
function accuse(s      )       {if(s.ended)return 'The investigation is closed.';if(s.active)return 'Finish the interview before submitting.';if(s.stage!==2)return 'Complete the opening paperwork first.';const d=s.draft;if(!person(d.suspect))return 'Choose a person.';const e=eligibility(s,d.suspect);if(!e.interview||!e.history||!e.lab)return 'This accusation is ineligible: a successful interview, completed employment history and completed personal laboratory report are all required.';if(!routes[d.route                       ]||!patterns[d.pattern                         ]||!certainties[d.certainty                            ]||d.reason.trim().length<40)return 'Complete the source explanation and write at least 40 characters of reasoning.';
const positive=completedLabs(s,d.suspect).filter(l=>l.method==='culture'&&l.finding==='positive');const cited=(id       )=>d.citations.includes(id)&&s.evidence.some(e=>e.id===id);
const checks         =[];if(!positive.some(l=>cited(l.id)))checks.push('No cited positive culture supports current shedding. A negative, Widal or microscopy result does not supply that support.');if(!cited('history-'+d.suspect))checks.push('The completed employment history was not cited.');if(!cited('interview-'+d.suspect))checks.push('The successful interview was not cited.');if(d.route!=='food')checks.push('The proposed route does not explain food-handling exposure.');if(d.pattern!=='recurrence')checks.push('The proposed chronology does not connect independent households.');if(d.certainty!=='limited')checks.push('The conclusion overstates what is known about the exact dish or intention.');
const correct=d.suspect===CASE.culprit;const kind=correct?(checks.length?'weak':'defensible'):'incorrect';s.ended={kind,suspect:d.suspect,reason:kind==='incorrect'?'The accusation meets the procedural requirements, but the selected person does not account for the cross-household pattern.':kind==='weak'?'You identified the historically associated person, but the submitted evidence or explanation is insufficient or contradictory.':'Your cited interview, employment pattern and positive culture support a person-linked foodborne source, with appropriate limits on certainty.',checks};log(s,'Final accusation submitted. Investigation closed.');return s.ended.reason;}
const SAVE='case-zero-14-v2';
function restore(raw            )      {try{const s=JSON.parse(raw||'null')         ;if(!s||s.version!==2||!Number.isInteger(s.day)||s.day<1||s.day>CASE.days||!Number.isInteger(s.ap)||s.ap<0||s.ap>3||![1,2].includes(s.stage))return initial();for(const k of ['reviewed','success','samples','labs','histories','evidence','connections','log']         )if(!Array.isArray(s[k]))return initial();if(!s.draft||!Array.isArray(s.draft.citations)||typeof s.draft.reason!=='string'||!s.hypotheses||!s.cooldown||!s.attitudes||typeof s.notebook!=='string')return initial();if(s.samples.some(x=>!source(x.source))||s.labs.some(l=>!methods[l.method]||!s.samples.some(x=>x.id===l.sample)))return initial();if(s.active&&(!person(s.active.person)||!['opening','questions','agreement'].includes(s.active.node)))return initial();return s;}catch{return initial();}}

function calculateScore(s      ){
 const id=s.ended?.suspect||s.draft.suspect;
 const cited=(key       )=>s.draft.citations.includes(key)&&s.evidence.some(e=>e.id===key);
 const positive=completedLabs(s,id).filter(l=>l.method==='culture'&&l.finding==='positive');
 const failures=s.log.filter(l=>l.includes('ended the interview;')).length;
 const rows=[
 {label:'Correct source',points:id===CASE.culprit?25:0,max:25,detail:'25 for identifying the source associated with the outbreak.'},
 {label:'Interview evidence',points:(s.success.includes(id)?5:0)+(s.success.includes(id)&&cited('interview-'+id)?5:0),max:10,detail:'5 for a successful interview; 5 for citing its record.'},
 {label:'Employment evidence',points:(s.histories.includes(id)?5:0)+(s.histories.includes(id)&&person(id)?.historyLink?5:0)+(s.histories.includes(id)&&cited('history-'+id)?5:0),max:15,detail:'5 for completed history, 5 for a recurring outbreak link, 5 for citing the report.'},
 {label:'Biological evidence',points:(positive.length?10:0)+(positive.some(l=>cited(l.id))?10:0),max:20,detail:'10 for a positive culture associated with the accused; 10 for citing it. A positive result alone does not establish source.'},
 {label:'Causal explanation',points:(s.draft.route==='food'?5:0)+(s.draft.pattern==='recurrence'?5:0)+(s.draft.certainty==='limited'?5:0),max:15,detail:'5 each for route, independent-household chronology and appropriately limited certainty. Free text is not automatically graded.'},
 {label:'Time management',points:s.ended?.kind==='defensible'?Math.min(10,Math.max(0,(CASE.days-s.day)*2)):0,max:10,detail:'For a defensible conclusion only: two points per full day remaining, up to 10.'},
 {label:'Witness cooperation',points:s.success.length?Math.max(0,5-failures):0,max:5,detail:'5 after at least one successful interview, minus 1 per interview lockout (minimum 0).'}
 ];
 const raw=rows.reduce((sum,r)=>sum+r.points,0);
 const cap=s.ended?.kind==='expired'?39:s.ended?.kind==='incorrect'?49:s.ended?.kind==='weak'?74:100;
 return {total:Math.min(raw,cap),raw,cap,rows};
}

function skipOffice(s      )      {if(!s.introSkipUnlocked&&!s.ended)return s;const next=initial(true);next.begun=true;for(const doc of documents){if(next.ap===0)endDay(next);readDocument(next,doc.id);}next.view='People';return next;}

                                                  
const escapeHTML=(v        )=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c] ));
const button=(text       ,action       ,value='',cls='',disabled=false)=>`<button class="${cls}" data-action="${action}" data-value="${escapeHTML(value)}" ${disabled?'disabled':''}>${text}</button>`;
const selectOptions=(o                      ,value       )=>Object.entries(o).map(([id,label])=>`<option value="${id}" ${id===value?'selected':''}>${label}</option>`).join('');
const portrait=(n       )=>`<svg viewBox="0 0 140 164" class="portrait" role="img" aria-label="Original illustrated character portrait"><defs><pattern id="h${n}" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 5L5 0" stroke="#847d67" stroke-width=".45"/></pattern></defs><rect width="140" height="164" fill="#d7cfb6"/><rect x="9" y="8" width="122" height="148" rx="60" fill="url(#h${n})"/><path d="M15 164Q20 116 52 116L88 116Q122 121 126 164" fill="${['#505d55','#52584f','#726854','#535a52','#656654','#635e51','#46574f','#6b6654'][n]}"/><path d="M58 105V126L70 139 83 126V102" fill="#b3a48a"/><ellipse cx="70" cy="72" rx="${25+n%3}" ry="38" fill="#c5b398"/><path d="M44 69Q35 22 72 26Q105 27 98 71L87 46Q64 59 48 48Z" fill="#55574c"/><path d="M54 74L62 73M78 73L86 74M70 78L67 91 74 91M61 101Q71 105 80 100" fill="none" stroke="#696252" stroke-width="1.5"/>${n%3===0?'<path d="M39 50H103L93 31H50Z" fill="#555f53"/>':''}${n%3===1?'<path d="M43 58Q30 94 48 112M97 58Q110 94 92 112" fill="none" stroke="#55574c" stroke-width="10"/>':''}<path d="M51 118L67 143 55 156M87 118L73 143 86 156" stroke="#c7c2a7" fill="none"/></svg>`;
function mapGraphic(){return `<svg class="field-map" viewBox="0 0 580 260" role="img" aria-label="Original schematic map of Oyster Bay investigation locations, not to scale"><rect width="580" height="260" fill="#d9dbc1"/><path d="M0 0H580V68L510 85 445 55 387 111 332 82 270 129 188 110 113 157 0 130Z" fill="#99b1a7"/><path d="M33 233Q194 189 258 162T535 144M180 244L240 152 341 117M240 152L110 180" fill="none" stroke="#b09e7b" stroke-width="4"/><g fill="#6d6650"><rect x="237" y="144" width="15" height="18"/><rect x="175" y="207" width="12" height="12"/><rect x="420" y="140" width="13" height="13"/><rect x="93" y="173" width="12" height="12"/></g><g font-family="Georgia" font-size="13" fill="#374e45"><text x="260" y="159">Summer house</text><text x="145" y="239">Market</text><text x="414" y="177">Consulting rooms</text><text x="43" y="207">Delivery yard</text><text x="320" y="42" font-style="italic">Oyster Bay</text><text x="22" y="25" font-size="10">FIELD DISTRICT · SCHEMATIC</text></g></svg>`;}
class CaseZero extends HTMLElement {
 s      =initial();message='';modal='';documentId='';sampleGroup='environment';filter='';storage=true;confirmId='';collectedSource='';dayCardPending=false;interviewResult                                                          =null;
 connectedCallback(){try{this.s=restore(localStorage.getItem(SAVE));if(this.s.ended)this.s.introSkipUnlocked=true;}catch{this.storage=false;}this.addEventListener('click',e=>this.click(e));this.addEventListener('change',e=>this.change(e));this.addEventListener('input',e=>this.input(e));this.addEventListener('keydown',e=>{if((e                 ).key==='Escape'&&this.modal){this.closeCard();this.render();}});if(this.s.ap===0&&!this.s.ended){if(this.s.active)this.dayCardPending=true;else this.modal='ap-exhausted';}this.render();}
 persist(){if(this.s.ended)this.s.introSkipUnlocked=true;try{localStorage.setItem(SAVE,JSON.stringify(this.s));this.storage=true;}catch{this.storage=false;}}
 name(id       ){const p=person(id) ;return this.s.success.includes(id)?p.name:p.alias;}
 locked(){return this.s.stage===1||!!this.s.ended;}
 intro(){return `<div class="opening"><div class="opening-copy"><div class="eyebrow">A historical detective game</div><h1>EPIDEMIOLOGIST<br><em>Case Zero</em></h1><div class="rule"></div><p class="big">Thirty days.<br>Six illnesses.<br>One unanswered question.</p><p>September, 1906. A summer household in Oyster Bay has suffered an outbreak of typhoid. You are George Soper, retained to discover how it began.</p><p>Read the records. Question the witnesses. Follow the specimens. Every day spent on one lead is a day you cannot spend on another.</p>${button('Accept the thirty-day commission →','begin','','primary')}${this.s.introSkipUnlocked?`<div class="replay-option">${button('Skip office introduction →','skipoffice')}<p class="fine">Replay unlocked · Start Day 4 with 2 AP and all ten documents filed.</p></div>`:''}<div class="fine">Historical fiction: the September commission, compressed calendar and dialogue are authored gameplay. The historical inquiry extended into 1907. Original illustrated portraits; no archival photographs.</div></div><div class="opening-prop"><div class="contract"><div class="eyebrow">Private commission / no. 001</div><h2>Oyster Bay</h2><p>To Mr. George A. Soper</p><p>Your services are retained for an inquiry into the recent fever at the summer property.</p><p>The term of this engagement shall be</p><strong class="thirty">30 DAYS</strong><p>Three investigative actions per day.<br>No extension of contract.</p><div class="signature">G. Thompson</div></div><div class="map-slip">${mapGraphic()}</div></div></div>`;}
 header(){const s=this.s;const pending=s.labs.filter(l=>!l.done).length, specimens=s.samples.filter(x=>!x.ready).length;return `<header class="top"><div class="brand">CASE ZERO <small>THE OYSTER BAY FILE</small></div><div class="clock"><strong>DAY ${String(s.day).padStart(2,'0')} <span>/ 30</span></strong><span>${30-s.day} days after today</span></div><div class="ap" aria-label="${s.ap} of 3 actions remaining"><span>${[1,2,3].map(i=>`<i class="${s.ap>=i?'available':''}"></i>`).join('')}</span><small>${s.ap} / 3 actions</small></div><div class="queues">${button(`${specimens} specimens · ${pending} reports`,'calendar')} ${button('Calendar','calendar')}</div>${button('End day →','endconfirm','','primary',!!s.ended||!!s.active)}</header>`;}
 office(){const s=this.s;const first=documents.slice(0,3).find(d=>!s.reviewed.includes(d.id));return `<div class="page-heading"><div><div class="eyebrow">${s.stage===1?'I · Preliminary inquiry':'II · Field investigation'}</div><h1>The investigator’s office</h1></div><span class="stamp">${s.reviewed.length} / 10 RECORDS FILED</span></div><p class="lead">${s.stage===1?'The correspondence arrived tied in string. Read each document before taking the inquiry into the field.':'The papers are filed. Decide which lead deserves the next part of your remaining time.'}</p><section class="desk-scene" aria-label="Investigator desk"><div class="lamp"><div class="shade"></div><div class="stem"></div><div class="base"></div></div><div class="desk-caption">G. A. SOPER<br><span>PRIVATE INQUIRY</span></div><div class="paper-stack">${documents.map((d,i)=>{const done=s.reviewed.includes(d.id);return button(`<small>RECORD ${String(i+1).padStart(2,'0')}</small><strong>${d.title}</strong><span>${done?'Filed · reread':first&&first.id!==d.id?'Sealed correspondence':'Open & review · 1 AP'}</span>`,'document',d.id,'paper',(!done&&(s.ap===0||!!first&&first.id!==d.id))||!!s.active);}).join('')}</div><div class="inkwell"></div></section><div class="office-bottom"><article class="map-card">${mapGraphic()}${button('Open interview directory →','view','People','',s.stage===1)}</article><article class="note-card"><div class="eyebrow">Rules of the engagement</div><h3>Your time is finite.</h3><p>Review, interview, collect or submit: <strong>1 AP</strong> each. Reconstructing a person’s employment takes <strong>the entire day</strong> and must begin with all three AP.</p><p>Specimens arrive the following morning. Laboratory reports take two days from submission. An offended witness returns three days after the failed interview.</p><p class="fine">Reading filed evidence and preparing your final report cost no AP. Zero AP prevents further investigative actions; you may still submit before ending the day. Ending Day 30 closes the case permanently.</p></article></div>`;}
 directory(){return `<div class="eyebrow">People & places</div><h1>The people behind the records</h1><p class="lead">An interview costs one action, however it ends. Listen to the boundary a witness sets. Personal samples and references require a successful conversation.</p><div class="people-grid">${people.map(p=>{const blocked=(this.s.cooldown[p.id]||0)>this.s.day;return `<article class="person-card"><div class="person-top">${portrait(p.portrait)}<div><span class="eyebrow">${p.place}</span><h2>${this.name(p.id)}</h2><p>${p.role}</p><small>${blocked?'Unavailable until Day '+this.s.cooldown[p.id]:escapeHTML(this.s.attitudes[p.id]||'Not yet interviewed')}</small></div></div>${button(this.s.success.includes(p.id)?'Return for questions · 1 AP':'Begin interview · 1 AP','interview',p.id,'',blocked||this.s.ap<1||!!this.s.active)}</article>`;}).join('')}</div>`;}
 sampleView(){const s=this.s;const list=sources.filter(x=>this.sampleGroup==='environment'?!x.person:!!x.person&&s.success.includes(x.person));return `<div class="eyebrow">Collection desk</div><h1>What is worth examining?</h1><p class="lead">Collection costs one action. A specimen collected on Day ${s.day} arrives on Day ${s.day+1}. Stock collected now is not the food served before the outbreak.</p><div class="tabs">${button('Environmental sources','group','environment',this.sampleGroup==='environment'?'selected':'')}${button('Personal specimens','group','personal',this.sampleGroup==='personal'?'selected':'')}</div><div class="source-grid">${list.map(x=>`<article class="source-card ${s.samples.some(y=>y.source===x.id&&y.collected===s.day)?'collected-today':''}"><div class="vial" aria-hidden="true"><i></i></div><div><small>${x.place} · ${x.kind}</small><h3>${x.label}</h3>${button(s.samples.some(y=>y.source===x.id&&y.collected===s.day)?'Collected today · available tomorrow':'Arrange collection · 1 AP','collect',x.id,'',s.ap<1||s.samples.some(y=>y.source===x.id&&y.collected===s.day))}</div></article>`).join('')||'<div class="empty">No personal specimens are available. Complete a successful interview first.</div>'}</div><h2 class="section-heading">Collection register</h2>${this.sampleRegister()}`;}
 sampleRegister(){return this.s.samples.length?`<div class="register">${this.s.samples.map(x=>`<article><strong>${source(x.source) .label}</strong><span>Collected Day ${x.collected} → arrival Day ${x.due}</span><b>${x.submitted?'Submitted to laboratory':x.ready?'Available':'In transit'}</b></article>`).join('')}</div>`:'<p class="empty">No specimens collected.</p>';}
 labView(){const s=this.s;const ready=s.samples.filter(x=>x.ready&&!x.submitted);return `<div class="eyebrow">Bacteriological correspondence</div><h1>Ask a precise question.</h1><p class="lead">Choose an available specimen and a suitable method. Each request costs one action. A submission today returns on Day ${s.day+2}${s.day>28?' — after your contract ends':''}.</p><div class="lab-grid">${ready.map(x=>{const src=source(x.source) ;return `<article class="form-sheet"><small>SPECIMEN ${x.id.replace('sample-','')} · COLLECTED DAY ${x.collected}</small><h3>${src.label}</h3><label>Examination method<select id="method-${x.id}">${Object.entries(methods).filter(([,m])=>m.kinds.includes(src.kind)).map(([id,m])=>`<option value="${id}">${m.name}</option>`).join('')}</select></label>${button('Send to laboratory · 1 AP','lab',x.id,'primary',s.ap<1)}</article>`;}).join('')||'<div class="empty">No unsubmitted specimens available. Collect samples, then wait until the following day.</div>'}</div><details><summary>Examination handbook</summary>${Object.values(methods).map(m=>`<p><strong>${m.name}.</strong> ${m.note}</p>`).join('')}</details><h2 class="section-heading">Laboratory register</h2><div class="register">${s.labs.map(l=>{const specimen=s.samples.find(x=>x.id===l.sample) ;return `<article class="lab-result"><div><small>${methods[l.method].name}</small><h3>${source(specimen.source) .label}</h3><p>Submitted Day ${l.submitted} · expected Day ${l.due}</p></div><div><strong>${l.done?l.finding .toUpperCase():'PENDING'}</strong>${l.done?`<p>${escapeHTML(l.text)}</p>`:`<p>${l.due>30?'Arrival falls outside contract.':l.due-s.day+' days remaining.'}</p>`}</div></article>`;}).join('')||'<p class="empty">No laboratory requests.</p>'}</div>`;}
 histories(){return `<div class="eyebrow">Employment inquiries</div><h1>One person. One entire day.</h1><p class="lead">Records, letters and former employers cannot be covered between appointments. Begin only on an unused day with three actions. The report is filed at day’s end and the calendar advances.</p><div class="history-grid">${people.map(p=>{const ready=this.s.success.includes(p.id),done=this.s.histories.includes(p.id);return `<article class="form-sheet"><small>${p.role}</small><h3>${this.name(p.id)}</h3>${done?`<p>${p.history}</p><span class="stamp">REPORT FILED</span>`:`<p>${ready?'References may now be pursued. Their relevance is not yet established.':'A successful interview is required before approaching references.'}</p>${button('Reconstruct employment · 3 AP','historyconfirm',p.id,'',!ready||this.s.ap!==3)}`}</article>`;}).join('')}</div>`;}
 notebookView(){const s=this.s;const nodes=[...people.map(p=>['person:'+p.id,this.name(p.id)+' · '+p.role]),...['Summer house','Market','Grounds','Earlier households'].map(x=>['place:'+x,x]),...s.evidence.map(e=>[e.id,e.title])];return `<div class="eyebrow">The evidence board</div><h1>Make the connections yourself.</h1><div class="board"><div class="hypotheses">${[['water','Contaminated water'],['food','Contaminated food'],['human','Human transmission']].map(([id,t])=>`<label class="theory"><strong>${t}</strong><textarea data-hypothesis="${id}" placeholder="Supporting evidence? Contradictions? What would distinguish this explanation?">${escapeHTML(s.hypotheses[id])}</textarea></label>`).join('')}</div><div class="linker"><label>Connect<select id="link-from">${nodes.map(([id,n])=>`<option value="${escapeHTML(id)}">${escapeHTML(n)}</option>`).join('')}</select></label><label>Relationship<input id="link-relation" placeholder="shared supply, before onset, contradicts…" maxlength="180"></label><label>To<select id="link-to">${nodes.map(([id,n])=>`<option value="${escapeHTML(id)}">${escapeHTML(n)}</option>`).join('')}</select></label>${button('Pin connection','connect','','primary')}</div>${s.connections.map((c,i)=>`<div class="connection"><strong>${escapeHTML(nodes.find(n=>n[0]===c.from)?.[1]||c.from)}</strong><span>— ${escapeHTML(c.relation)} →</span><strong>${escapeHTML(nodes.find(n=>n[0]===c.to)?.[1]||c.to)}</strong>${button('Remove','unlink',String(i))}</div>`).join('')}</div><label class="note-label section-heading">Investigation journal<textarea id="notebook" placeholder="Record how the evidence changes your explanation…">${escapeHTML(s.notebook)}</textarea></label><div class="page-heading"><h2>Filed evidence · ${s.evidence.length}</h2><label>Show<select id="evidence-filter"><option value="">All files</option>${['Document','Interview statement','Completed interview','Interview follow-up','Employment history','Laboratory'].map(k=>`<option ${this.filter===k?'selected':''}>${k}</option>`).join('')}</select></label></div><div class="evidence-grid">${s.evidence.filter(e=>!this.filter||e.kind===this.filter).map(e=>`<article class="form-sheet"><small>${e.kind} · DAY ${e.day}</small><h3>${escapeHTML(e.title)}</h3><p class="preserve">${escapeHTML(e.text)}</p></article>`).join('')}</div><details><summary>Chronological activity log</summary>${s.log.map(x=>`<p>${escapeHTML(x)}</p>`).join('')}</details>`;}
 submissionMissing(){const s=this.s,d=s.draft,e=eligibility(s,d.suspect),missing         =[];if(!d.suspect)missing.push('Select the person your conclusion concerns.');else{if(!e.interview)missing.push('Complete a successful interview with the selected person.');if(!e.history)missing.push('Complete the selected person’s employment-history investigation.');if(!e.lab)missing.push('Obtain a completed laboratory report from the selected person’s biological specimen. Collected specimens and pending reports do not count.');}if(!d.route)missing.push('Select a proposed transmission route.');if(!d.pattern)missing.push('Select an explanation of the chronology.');if(!d.certainty)missing.push('Select the limits of your conclusion.');if(d.reason.trim().length<40)missing.push('Write at least 40 characters of reasoning ('+d.reason.trim().length+'/40).');return missing;}
 submissionStatus(){const missing=this.submissionMissing();return `${button('Submit final accusation','accuseconfirm','','primary',!!missing.length)}<div role="status">${missing.length?'<strong>Before you can submit:</strong><ul>'+missing.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<strong>Ready to submit.</strong> Review your cited evidence before filing.'}<p>Final submission costs no AP. It ends this run.</p></div>`;}
 conclusion(){const s=this.s,d=s.draft,e=eligibility(s,d.suspect);return `<div class="eyebrow">Final submission · ends the investigation</div><h1>Who does the evidence implicate?</h1><p class="lead">The three prerequisites establish eligibility, not guilt. A patient may test positive without being the source. Your cited evidence and causal explanation determine the outcome.</p><article class="note-card"><h2>Preparing your final report</h2><ol><li>Select a person. The interview, employment history and biological laboratory report must all belong to that person.</li><li>Choose a transmission route, explain the timing, and state the limits of what you can conclude.</li><li>Write your reasoning: connect the person, chronology and laboratory findings, and consider competing explanations.</li><li>Check the evidence boxes to cite the records supporting your claims. Having a record in your notebook does not automatically cite it.</li><li>Review the report, then submit. Eligibility allows an accusation; it does not guarantee that the evidence supports it.</li></ol></article><div class="conclusion-grid"><article class="form-sheet"><label>Person<select data-draft="suspect"><option value="">Select a person</option>${people.map(p=>`<option value="${p.id}" ${d.suspect===p.id?'selected':''}>${this.name(p.id)} · ${p.role}</option>`).join('')}</select></label><div class="requirements">${[['Successful interview',e.interview],['Completed employment history',e.history],['Completed personal laboratory report',e.lab]].map(([t,ok])=>`<p>${ok?'✓':'○'} ${t}</p>`).join('')}</div><label>Proposed transmission route<select data-draft="route"><option value="">State the route</option>${selectOptions(routes,d.route)}</select></label><label>Explain the chronology<select data-draft="pattern"><option value="">State the pattern</option>${selectOptions(patterns,d.pattern)}</select></label><label>Limits of your conclusion<select data-draft="certainty"><option value="">State what remains uncertain</option>${selectOptions(certainties,d.certainty)}</select></label><label>Written explanation<textarea data-draft="reason" placeholder="Connect person, chronology and biological result. Address a plausible alternative. Minimum 40 characters.">${escapeHTML(d.reason)}</textarea></label><p class="fine">The authored rubric checks your selected causal claims and citations. Your written explanation is retained for review; no language model grades it.</p></article><article class="form-sheet"><h2>Evidence you rely on</h2><p>Cite the relevant interview, employment report and biological finding. Uncollected and pending results cannot be cited.</p>${s.evidence.map(ev=>`<label class="citation"><input type="checkbox" data-citation="${ev.id}" ${d.citations.includes(ev.id)?'checked':''}><span>${escapeHTML(ev.title)}<small>${ev.kind} · Day ${ev.day}</small></span></label>`).join('')}</article></div><div class="submission" id="submission-status">${this.submissionStatus()}</div>`;}
 ending(){const s=this.s,v=s.ended ,score=calculateScore(s);const title={expired:'The contract has expired.',incorrect:'A complete file. An incorrect accusation.',weak:'The right person. An unproven case.',defensible:'A defensible conclusion.'}[v.kind];return `<div class="ending"><div class="eyebrow">Contract closed · Day ${s.day} / 30</div><h1>${title}</h1><section class="score-card" aria-label="Final investigation score"><div class="eyebrow">Final investigation score</div><div class="score-number">${score.total}<span> / 100</span></div><div class="score-categories">${score.rows.map(r=>`<div class="score-row"><strong>${r.label}</strong><span>${r.points} / ${r.max}</span></div>`).join('')}${score.raw>score.total?`<div class="score-row"><strong>Case outcome adjustment</strong><span>−${score.raw-score.total}</span></div>`:''}</div>${score.total===100?`<details><summary>Perfect investigation — score details</summary>${score.rows.map(r=>`<p><strong>${r.label}</strong> · ${r.detail}</p>`).join('')}</details>`:''}</section><p class="lead">${v.reason}</p>${v.suspect?`<p>Accused: <strong>${person(v.suspect) .name}</strong> · ${person(v.suspect) .role}</p>`:''}${score.total===100?v.checks.map(c=>`<div class="notice">${c}</div>`).join(''):''}<div class="form-sheet"><h2>Closing record</h2><p>${s.reviewed.length} opening records · ${s.success.length} successful witness interviews · ${s.histories.length} employment histories · ${s.labs.filter(l=>l.done).length} completed laboratory examinations.</p><p class="preserve">${escapeHTML(s.draft.reason)||'No final explanation was filed.'}</p><p class="fine">${s.samples.filter(x=>!x.ready).length} specimens and ${s.labs.filter(l=>!l.done).length} reports remained pending. The calendar is frozen; there is no extension or reopening of this run.</p></div>${score.total===100?`<details class="debrief"><summary>Read the historical debrief — reveals the source</summary><p>The investigation is inspired by Soper’s tracing of Mary Mallon across households with typhoid. Her apparent health did not preclude carriage. The food route was supported by the employment pattern and bacteriology; an exact dessert was suspected rather than conclusively demonstrated.</p><p>This version compresses events into a fictional September contract. All dialogue, the other named suspects, their histories, specimen schedules and cooperation are authored. Mallon’s voluntary agreement here is a counterfactual; historical examinations involved coercion. This game establishes neither malicious intent nor a justification for every restriction imposed historically.</p><p><a href="https://sites.lsa.umich.edu/rbender/syllabus/george-soper-on-mary-mallon/" target="_blank" rel="noopener">Soper’s account</a> · <a href="https://guides.loc.gov/chronicling-america-typhoid-mary" target="_blank" rel="noopener">Library of Congress timeline</a> · <a href="https://www.gutenberg.org/files/48793/48793-h/48793-h.htm" target="_blank" rel="noopener">Period bacteriology handbook</a></p></details>`:''}<div class="row">${button('Export closing report','exportreport','','primary')}${button('Start a new investigation','restartconfirm')}</div></div>`;}
 calendar(){const s=this.s;return `<h2>The thirty-day contract</h2><p>Day ${s.day} is in progress. <strong>${30-s.day} full days remain after today.</strong> ${s.ap} actions remain today.</p><div class="calendar-grid">${Array.from({length:30},(_,i)=>`<div class="${i+1===s.day?'today':i+1<s.day?'past':''}"><strong>${i+1}</strong><small>${s.samples.some(x=>!x.ready&&x.due===i+1)?'Specimen':''}${s.labs.some(x=>!x.done&&x.due===i+1)?' Report':''}</small></div>`).join('')}</div><h3>Pending specimens</h3>${s.samples.filter(x=>!x.ready).map(x=>`<p>${source(x.source) .label} · collected ${x.collected}, due ${x.due}${x.due>30?' (after expiry)':''}</p>`).join('')||'<p>None.</p>'}<h3>Pending laboratory reports</h3>${s.labs.filter(x=>!x.done).map(x=>`<p>${source(s.samples.find(y=>y.id===x.sample) .source) .label} · submitted ${x.submitted}, due ${x.due}${x.due>30?' (after expiry)':''}</p>`).join('')||'<p>None.</p>'}<h3>Witnesses unavailable</h3>${people.filter(p=>(s.cooldown[p.id]||0)>s.day).map(p=>`<p>${this.name(p.id)} · returns Day ${s.cooldown[p.id]}</p>`).join('')||'<p>None.</p>'}`;}
 interviewEnding(){const r=this.interviewResult ,p=person(r.person) ,cooperating=this.s.success.includes(p.id);const title={success:'Interview successful',partial:'Interview partially completed',failed:'Interview terminated'}[r.outcome];return `<div class="interview-ending"><div class="dialogue-head">${portrait(p.portrait)}<div><span class="eyebrow">Interview result · Day ${this.s.day}</span><h2>${title}</h2><p>${p.name} · ${p.role}</p></div></div><p class="spoken">${escapeHTML(this.s.conversation)}</p><div class="result-facts"><p><strong>Action spent:</strong> 1 AP · ${this.s.ap} actions remain today.</p>${r.outcome==='success'?'<p><strong>Personal specimens:</strong> Available for collection.</p><p><strong>Employment history:</strong> Available to investigate on a fresh three-AP day.</p>':`<p><strong>Access:</strong> ${cooperating?'Permission from your earlier successful interview is retained.':'Personal specimens and employment history remain locked. A successful interview is still required.'}</p>`}${r.outcome==='failed'?`<p><strong>Witness unavailable:</strong> Three-day lockout. Returns at the start of Day ${this.s.cooldown[p.id]}${this.s.cooldown[p.id]>30?' — after your contract expires':''}.</p>`:'<p><strong>Next interview:</strong> No cooldown. Returning costs another 1 AP.</p>'}<p><strong>Evidence:</strong> ${this.s.evidence.some(e=>e.id==='statement-'+p.id||e.id==='interview-'+p.id)?'Filed statements remain in your notebook.':'No interview evidence has been filed for this witness.'}</p></div>${button('Return to investigation →','close','','primary')}</div>`;}
 closeCard(){if(this.dayCardPending){this.dayCardPending=false;this.modal='ap-exhausted';}else this.modal='';}
 overlay(){let content='';if(this.s.active){const p=person(this.s.active.person) ;content=`<div class="dialogue-head">${portrait(p.portrait)}<div><span class="eyebrow">${p.place} · 1 AP already spent</span><h2>${p.name}</h2><p>${p.role}</p></div></div><p class="spoken">${escapeHTML(this.s.conversation)}</p><div class="responses">${choices(this.s).map(c=>button(c.text,'reply',c.id,'response',!!c.disabled)+(c.disabled?'<small>Supporting record not yet obtained.</small>':'')).join('')}</div><p class="fine">Authored dialogue. An unsupported accusation can end the interview for three days. Agreement here is a gameplay reconstruction.</p>`;}else if(this.modal==='sample-collected'){content=`<div class="eyebrow">Collection recorded · Day ${this.s.day}</div><h2>Sample collection arranged</h2><h3>${source(this.collectedSource)?.label||'Specimen'}</h3><div class="result-facts"><p><strong>Action spent: 1 AP</strong> · ${this.s.ap} actions remain today.</p><p><strong>Arrival:</strong> Start of Day ${this.s.day+1}${this.s.day===30?' — after the contract expires':''}.</p><p>This source is unavailable for another collection today. It becomes available again tomorrow.</p><p>Once the specimen arrives, select it in Laboratory and request an analysis for 1 AP. Results take two further days.</p></div>${button('Continue investigation →','close','','primary')}`;}else if(this.modal==='interview-result'&&this.interviewResult){content=this.interviewEnding();}else if(this.modal==='document'){const d=documents.find(d=>d.id===this.documentId) ;content=`<div class="document"><div class="eyebrow">${d.heading}</div><h2>${d.title}</h2><p class="document-body">${d.body}</p><div class="signature">Copy received / G.A.S.</div><hr><p class="fine">Investigator’s note: ${d.clue}</p><p class="fine">Reconstructed period document; not a transcription.</p></div>`;}else if(this.modal==='calendar')content=this.calendar();else if(this.modal==='ap-exhausted')content=`<div class="eyebrow">Daily actions complete</div><h2>End Day ${this.s.day}?</h2><p>You have used all three action points. No further investigative actions are available today.</p><p>${this.s.day===30?'This is the final day. Ending it without an accusation expires your contract. You can still review evidence and submit your final accusation before closing the day.':`Advance to Day ${this.s.day+1} to receive three new actions and any specimens or reports due that morning. You can also stay to review your notebook or prepare a final accusation.`}</p><div class="row">${button(this.s.day===30?'End Day 30 · expire contract':'End day →','end','','primary')}${button('Stay & review evidence','close')}</div>`;else if(this.modal==='day')content=`<h2>${this.s.day===30?'Close the contract?':'Close today’s notebook?'}</h2><p>${this.s.day===30?'Ending Day 30 without an accusation causes contract failure. There is no Day 31.':`You have ${this.s.ap} unused actions. They will be lost. Pending timers advance at the start of Day ${this.s.day+1}.`}</p>${button(this.s.day===30?'End Day 30 · expire contract':'End day','end','','primary')}`;else if(this.modal==='history')content=`<h2>A full day of inquiry</h2><p>Reconstruct ${this.name(this.confirmId)}’s employment. All three AP are spent and the day ends automatically.${this.s.day===30?' This will end your contract before you can submit a new accusation.':''}</p>${button('Spend the day','history',this.confirmId,'primary')}`;else if(this.modal==='accuse')content=`<h2>File the final accusation?</h2><p>The investigation ends when a valid submission is filed. You cannot gather more evidence afterward.</p>${button('File final accusation','accuse','','primary')}`;else if(this.modal==='restart')content=`<h2>Begin a new contract?</h2><p>This replaces the current local save. Export your save first if you want to preserve this run.</p>${button('Restart with office introduction','restart','','primary')}${this.s.introSkipUnlocked||this.s.ended?`<div class="replay-option">${button('Restart & skip office introduction','skipoffice')}<p>Start Day 4 with 2 AP. All introductory evidence is already filed.</p></div>`:''}`;else return '';return `<div class="scrim"><section class="modal" role="dialog" aria-modal="true" aria-label="${this.s.active?'Witness interview':this.modal==='interview-result'?'Interview result':'Case document'}" tabindex="-1">${this.s.active?'':button('Close ×','close','','close')}${content}</section></div>`;}
 render(){const s=this.s;if(!s.begun){this.innerHTML=this.intro();return;}const views                        ={Office:()=>this.office(),People:()=>this.directory(),Samples:()=>this.sampleView(),Laboratory:()=>this.labView(),Histories:()=>this.histories(),Notebook:()=>this.notebookView(),Conclusion:()=>this.conclusion()};this.innerHTML=`<a class="skip" href="#main">Skip to workspace</a>${this.header()}<div class="body-shell"><aside><nav aria-label="Office sections">${Object.keys(views).map((v,i)=>button(`<small>0${i+1}</small> ${v}`,'view',v,s.view===v?'selected':'',!!s.ended||s.stage===1&&!['Office','Notebook'].includes(v))).join('')}</nav><div class="save-controls"><small>${this.storage?'Progress saved locally':'Automatic save unavailable'}</small>${button('Export save','exportsave')}<label>Import save<input id="import-save" type="file" accept="application/json"></label>${button('Restart','restartconfirm')}</div></aside><main id="main" tabindex="-1">${this.message?`<div role="status" class="message">${escapeHTML(this.message)} ${button('×','dismiss')}</div>`:''}${s.ended?this.ending():views[s.view]?.()||this.office()}<footer>Historical fiction · deterministic case · September 1906 / compressed chronology · Source notes included with the project</footer></main></div>${this.overlay()}`;}
 download(name       ,text       ){const a=document.createElement('a');const u=URL.createObjectURL(new Blob([text],{type:name.endsWith('.json')?'application/json':'text/plain'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
 click(e      ){const b=(e.target           ).closest                   ('button[data-action]');if(!b||b.disabled)return;const {action,value=''}=b.dataset;const previousAP=this.s.ap;this.message='';switch(action){case 'begin':this.s.begun=true;break;case 'view':if(!this.s.active&&!this.s.ended){this.s.view=value        ;}break;case 'document':{const before=this.s.reviewed.includes(value);this.message=readDocument(this.s,value);if(before||this.s.reviewed.includes(value)){this.documentId=value;this.modal='document';}break;}case 'calendar':this.modal='calendar';break;case 'endconfirm':this.modal='day';break;case 'end':this.modal='';this.dayCardPending=false;this.message=endDay(this.s);break;case 'interview':this.message=startInterview(this.s,value);break;case 'reply':{const pid=this.s.active?.person;this.message=reply(this.s,value);if(pid&&!this.s.active){this.interviewResult={person:pid,outcome:value==='agree'?'success':['accuse','demand','insult'].includes(value)?'failed':'partial'};this.modal='interview-result';}break;}case 'group':this.sampleGroup=value;break;case 'collect':{const count=this.s.samples.length;this.message=collectSample(this.s,value);if(this.s.samples.length>count){this.collectedSource=value;this.modal='sample-collected';}break;}case 'lab':this.message=requestLab(this.s,value,(this.querySelector('#method-'+value)                     ).value          );break;case 'historyconfirm':this.confirmId=value;this.modal='history';break;case 'history':this.modal='';this.message=history(this.s,value);break;case 'connect':{const from=(this.querySelector('#link-from')                     ).value,to=(this.querySelector('#link-to')                     ).value,relation=(this.querySelector('#link-relation')                    ).value.trim();if(relation&&from!==to)this.s.connections.push({from,to,relation});else this.message='Choose two different records and describe the connection.';break;}case 'unlink':this.s.connections.splice(Number(value),1);break;case 'accuseconfirm':if(!this.submissionMissing().length)this.modal='accuse';break;case 'accuse':this.modal='';this.message=accuse(this.s);break;case 'restartconfirm':this.modal='restart';break;case 'skipoffice':if(this.s.introSkipUnlocked||this.s.ended){this.s=skipOffice(this.s);this.modal='';this.dayCardPending=false;this.interviewResult=null;this.message='Office introduction completed. Day 4 · 2 actions remain. All ten documents are in your notebook.';}break;case 'restart':this.s=initial(!!this.s.introSkipUnlocked||!!this.s.ended);this.modal='';this.dayCardPending=false;break;case 'close':this.closeCard();break;case 'exportsave':this.download('Case-Zero-save.json',JSON.stringify(this.s,null,2));break;case 'exportreport':this.download('Case-Zero-closing-report.txt',`CASE ZERO · DAY ${this.s.day}\nScore: ${calculateScore(this.s).total}/100\n${calculateScore(this.s).rows.map(r=>r.label+': '+r.points+'/'+r.max).join('\n')}\n${this.s.ended?.kind}\n${this.s.ended?.reason}\n${calculateScore(this.s).total===100?calculateScore(this.s).rows.map(r=>r.detail).join('\n'):''}\n\n${this.s.draft.reason}\n\nCited files:\n${this.s.evidence.filter(e=>this.s.draft.citations.includes(e.id)).map(e=>e.title+'\n'+e.text).join('\n\n')}\n\nActivity:\n${this.s.log.join('\n')}`);break;case 'dismiss':break;}if(previousAP>0&&this.s.ap===0&&!this.s.ended){if(this.s.active||this.modal==='document'||this.modal==='interview-result'||this.modal==='sample-collected')this.dayCardPending=true;else this.modal='ap-exhausted';}this.persist();this.render();if(this.modal||this.s.active)this.querySelector             ('.modal')?.focus();else if(['view','begin','accuse','end','history'].includes(action||'')){this.querySelector             ('main')?.focus();window.scrollTo(0,0);}}
 input(e      ){const t=e.target                    ;if(this.s.ended)return;if(t.id==='notebook')this.s.notebook=t.value;if(t.dataset.hypothesis)this.s.hypotheses[t.dataset.hypothesis]=t.value;if(t.dataset.draft==='reason'){this.s.draft.reason=t.value;const status=this.querySelector('#submission-status');if(status)status.innerHTML=this.submissionStatus();}this.persist();}
 async change(e      ){const t=e.target                    ;if(t.id==='import-save'){try{const raw=await t.files [0].text(),candidate=restore(raw);if(!candidate.begun)throw Error();this.s=candidate;this.modal='';this.message='Saved contract restored.';}catch{this.message='Not a supported saved contract.';}this.persist();this.render();return;}if(this.s.ended)return;if(!t.dataset.draft&&!t.dataset.citation&&t.id!=='evidence-filter')return;if(t.dataset.draft){(this.s.draft                                     )[t.dataset.draft]=t.value;}if(t.dataset.citation){this.s.draft.citations=this.s.draft.citations.filter(x=>x!==t.dataset.citation);if(t.checked)this.s.draft.citations.push(t.dataset.citation);}if(t.id==='evidence-filter')this.filter=t.value;this.persist();this.render();if(t.dataset.citation)this.querySelector                  (`[data-citation="${t.dataset.citation}"]`)?.focus();if(t.dataset.draft)this.querySelector                  (`[data-draft="${t.dataset.draft}"]`)?.focus();}
}
customElements.define('case-zero',CaseZero);

})();</script></body></html>
